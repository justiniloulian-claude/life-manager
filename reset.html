<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resetting…</title>
<style>
body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,sans-serif;background:#f7f5ff;color:#18102e;text-align:center;padding:20px;}
.msg{font-size:18px;font-weight:600;margin-bottom:8px;}
.sub{font-size:14px;color:#6b5e8a;}
</style>
</head>
<body>
<div>
  <div class="msg" id="msg">Clearing old cache…</div>
  <div class="sub" id="sub">One moment</div>
</div>
<script>
(async function() {
  var msg = document.getElementById('msg');
  var sub = document.getElementById('sub');

  // 1. Unregister ALL service workers
  if ('serviceWorker' in navigator) {
    var regs = await navigator.serviceWorker.getRegistrations();
    for (var r of regs) { await r.unregister(); }
  }

  // 2. Clear ALL caches
  if ('caches' in window) {
    var keys = await caches.keys();
    for (var k of keys) { await caches.delete(k); }
  }

  // 3. Clear localStorage app cache keys (keep user data)
  // (leave esav_* keys intact so data is preserved)

  msg.textContent = 'Done! Loading fresh app…';
  sub.textContent = 'Redirecting in 1 second…';

  // 4. Redirect to the fresh app (unique URL = Fastly cache miss = guaranteed fresh HTML)
  setTimeout(function() {
    window.location.replace('https://justiniloulian-claude.github.io/life-manager/?fresh=' + Date.now());
  }, 1000);
})();
</script>
</body>
</html>
