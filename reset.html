<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resetting…</title>
<style>
body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,sans-serif;background:#f7f5ff;color:#18102e;text-align:center;padding:20px;}
.msg{font-size:18px;font-weight:600;margin-bottom:8px;}
.sub{font-size:14px;color:#6b5e8a;}
</style>
</head>
<body>
<div>
  <div class="msg">Clearing cache…</div>
  <div class="sub">Loading fresh app in 2 seconds</div>
</div>
<script>
// Redirect ALWAYS fires after 2 seconds regardless of cleanup status
var dest = window.location.origin + '/index.html';
setTimeout(function() { window.location.replace(dest); }, 2000);

// Best-effort cleanup (fire and forget — don't block the redirect)
try {
  if (navigator.serviceWorker) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(r) { try { r.unregister(); } catch(e) {} });
    }).catch(function() {});
  }
} catch(e) {}

try {
  if (window.caches) {
    caches.keys().then(function(keys) {
      keys.forEach(function(k) { try { caches.delete(k); } catch(e) {} });
    }).catch(function() {});
  }
} catch(e) {}
</script>
</body>
</html>
